services:
  - type: web
    name: satyacheck
    env: python
    rootDir: satyacheck-repo-seed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_BODY_IDENTITY
        value: "true"
      - key: LICENSE_BOOTSTRAP
        value: '{"licensee":"Demo Bank","expires_at":"2026-11-30T16:18:29.141842+00:00","signature":"F4JtrV95BDI4dZCrrO3aUmwYrXNcJ0s5uOT7vqGU6LVssdvF9WdzyZJho4Dr+qlJLPrHt17HVCJdwS+AcXwVCg=="}'
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REPORTER_SALT
        generateValue: true
      - key: IP_SALT
        generateValue: true
databases:
  - name: satyacheck-db
    databaseName: satyacheck
    user: satyacheck
    plan: free

services:
  - type: web
    name: satyacheck
    env: python
    rootDir: satyacheck-repo-seed
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: satyacheck-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_BODY_IDENTITY
        value: "true"
      - key: LICENSE_BOOTSTRAP
        value: '{"licensee":"Demo Bank","expires_at":"2026-11-30T16:18:29.141842+00:00","signature":"F4JtrV95BDI4dZCrrO3aUmwYrXNcJ0s5uOT7vqGU6LVssdvF9WdzyZJho4Dr+qlJLPrHt17HVCJdwS+AcXwVCg=="}'
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REPORTER_SALT
        generateValue: true
      - key: IP_SALT
        generateValue: true