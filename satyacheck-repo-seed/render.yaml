services:
  - type: web
    name: satyacheck
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: TRUST_BODY_IDENTITY
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REPORTER_SALT
        generateValue: true
      - key: IP_SALT
        generateValue: true
